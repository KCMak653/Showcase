[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "showcase"
version = "0.1.0"
description = "Scrape local music events and build Spotify playlists"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12",
    "fuzzywuzzy>=0.18",
    "python-Levenshtein>=0.21",
    "pandas>=2.2",
    "requests>=2.31",
    "spotipy>=2.23",
    "openai>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-dateutil>=2.8",
    "supabase>=2.0",
]

[project.scripts]
showcase = "showcase.main:handle"

[tool.hatch.build.targets.wheel]
packages = ["showcase"]
