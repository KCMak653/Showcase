events: # Refers to the events. An event can be a group of bands (shows) on a single performance date
  event_<N>: #Fill in N with the event number, start at 1 and increase consecutively
    bands: "" #Raw string of bands names playing. Do not format or change order
    event_timestamp: "" # Event timestamp in "YYYY-MM-DDTHH:MM:SS" ISO 8601 format
    venue: "" # Event venue